name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      # خريطة العراق: تُحفظ في الكاش حتى لا تُولَّد من جديد في كل بناء
      - name: Cache Iraq map
        uses: actions/cache@v4
        with:
          path: |
            www/assets/iraq.pmtiles
            .build/planetiler
          key: iraq-tiles-${{ hashFiles('scripts/generate-iraq-tiles.mjs') }}

      - name: Prepare web app (fonts, Iraq tiles, offline HTML)
        run: |
          npm run build:fonts
          npm run build:tiles
          npm run build:web

      - name: Add Android platform
        run: npm run android:add

      - name: Apply app icons
        run: |
          if [ -f icons.zip ]; then
            unzip -o icons.zip -d icons_extracted
            cp -r icons_extracted/android_res/mipmap-* android/app/src/main/res/
          else
            npm run android:icons
          fi

      - name: Patch AndroidManifest
        run: |
          if [ -f scripts/patch-manifest.js ]; then node scripts/patch-manifest.js; fi

      - name: Add floating window (PiP)
        run: |
          if [ -f scripts/add-pip.js ]; then node scripts/add-pip.js; fi

      - name: Register offline map plugin
        run: npm run android:prepare

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK for download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk sqoor-app.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sqoor-app
          path: sqoor-app.apk
          if-no-files-found: error
